[package]
name = "p2pshare"
version = "3.4.6"
description = "Partage de fichiers et chat en pair-à-pair"
authors = ["lamzii"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "p2pshare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Invitation links (p2pshare://ami?…) open the app (see invite.rs).
tauri-plugin-deep-link = "2.6"
iroh = "1.3"
n0-future = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
bytes = "1"
hex = "0.4"
rand = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
base64 = "0.22"
rcgen = { version = "0.14.7", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
ring = "0.17"
webpki-roots = "1"
# The way to iroh's relays through our own (see src/p2p/tunnel.rs).
tokio-websockets = { version = "0.13", default-features = false, features = ["client", "getrandom", "rand", "sha1_smol"] }
socket2 = { version = "0.6", features = ["all"] }
# Without the default gateway lookup (an ARP request on Windows) on each look
# at the interfaces: we only read their addresses.
netdev = { version = "0.46", default-features = false }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security_Cryptography",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemServices",
    "Win32_UI_WindowsAndMessaging",
] }

# The history key is kept in the Keychain.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
# Already built for Tauri: the window's Space behaviour (see show_window).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }

# Desktop only: login item, one instance (Android runs one per app anyway).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
# A link clicked while the app runs reaches it, not a second one.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"

[target.'cfg(not(any(windows, target_os = "android", target_os = "ios")))'.dependencies]
notify-rust = "4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
