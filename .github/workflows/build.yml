name: Build/Release

# Every push and pull request builds the installers (downloadable from the
# Actions tab). A GitHub release is only published when a version tag
# (v1.2.3) is pushed. A manual run can target some platforms only, e.g.
#   gh workflow run build.yml -f platforms='["macos-latest"]'
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Runners to build on (JSON list)'
        default: '["windows-latest", "macos-latest", "ubuntu-22.04"]'

  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms || '["windows-latest", "macos-latest", "ubuntu-22.04"]') }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Test P2P core
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: Build installers
        run: npx tauri build

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: P2PShare-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ./artifacts
          merge-multiple: true

      # Lets users check what they downloaded (the installers are not signed).
      - name: Compute checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -print0 |
            while IFS= read -r -d '' f; do
              echo "$(sha256sum "$f" | cut -d' ' -f1)  $(basename "$f")"
            done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: P2PShare ${{ github.ref_name }}
          # Each installer sits in its bundle folder (nsis/, dmg/, appimage/).
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: true
          generate_release_notes: true
          body: |
            ## Installation

            Téléchargez l'installeur correspondant à votre système :

            - **Windows** : `P2PShare_*_x64-setup.exe`
            - **macOS** (Apple Silicon) : `P2PShare_*_aarch64.dmg`
            - **Linux** : `P2PShare_*_amd64.AppImage`

            La version 3 n'échange pas avec les versions 2.x (Electron) : vos amis doivent aussi passer à la v3. Votre ID, vos amis et vos messages sont repris automatiquement.

  # Sends the new version to winget (see winget.yml).
  winget:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/winget.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
