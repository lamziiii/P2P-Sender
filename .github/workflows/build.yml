name: Build/Release

# Every push and pull request builds the installers (downloadable from the
# Actions tab). A GitHub release is only published when a version tag
# (v1.2.3) is pushed; it must match the version of package.json,
# tauri.conf.json and Cargo.toml. A prerelease tag (v1.2.3-beta.1) is
# published as a prerelease, not marked latest, and not sent to winget.
# A manual run can target some platforms only, e.g.
#   gh workflow run build.yml -f platforms='["macos-latest"]'
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Runners to build on (JSON list)'
        default: '["windows-latest", "macos-latest", "ubuntu-22.04"]'
      android:
        description: 'Build the Android APK too'
        type: boolean
        default: true

  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  # A release tag must name the version being built.
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the tag against the app version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tag="${TAG#v}"
          npm_version=$(node -p "require('./package.json').version")
          tauri_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          # The first version line is the one of [package].
          cargo_version=$(grep -m1 '^version *=' src-tauri/Cargo.toml | sed 's/^version *= *"\(.*\)".*/\1/')
          echo "tag $tag · package.json $npm_version · tauri.conf.json $tauri_version · Cargo.toml $cargo_version"
          status=0
          for pair in "package.json:$npm_version" "src-tauri/tauri.conf.json:$tauri_version" "src-tauri/Cargo.toml:$cargo_version"; do
            if [ "${pair#*:}" != "$tag" ]; then
              echo "::error file=${pair%%:*}::version ${pair#*:} does not match the tag $TAG"
              status=1
            fi
          done
          # A stable release says what it brings: the release page and the
          # app (after the update) show this section of CHANGELOG.md, dated
          # ("à venir" stands for the date until the release).
          heading=$(awk -v v="$tag" '$1 == "##" && $2 == v { print; exit }' CHANGELOG.md)
          if [[ "$tag" != *-* ]]; then
            if [ -z "$heading" ]; then
              echo "::error file=CHANGELOG.md::no section \"## $tag\" for this version"
              status=1
            elif [[ "$heading" != *" — "?* ]] || [[ "$heading" == *"à venir"* ]]; then
              echo "::error file=CHANGELOG.md::the section \"## $tag\" has no release date"
              status=1
            fi
          fi
          exit $status

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms || '["windows-latest", "macos-latest", "ubuntu-22.04"]') }}

    runs-on: ${{ matrix.os }}
    env:
      # Only given to version tags: it signs the updates (see update.rs).
      UPDATER_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}

    steps:
      - name: Check out git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Test P2P core
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml

      # Windows release builds are signed through SignPath once its token is
      # set (secret SIGNPATH_API_TOKEN, see "Code signing" in the README);
      # everything else is built as before, unsigned.
      - name: Decide on signing
        id: sign
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [ "$RUNNER_OS" = Windows ] && [ -n "$SIGNPATH_API_TOKEN" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installers
        if: steps.sign.outputs.enabled != 'true'
        # Arguments after -- go to cargo build.
        run: npx tauri build -- --locked

      # Signed: the app first, so that the installer carries the signed exe,
      # then the installer itself.
      - name: Build the app
        if: steps.sign.outputs.enabled == 'true'
        run: npx tauri build --no-bundle -- --locked

      - name: Upload the app for signing
        if: steps.sign.outputs.enabled == 'true'
        id: unsigned-app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-app
          path: src-tauri/target/release/p2pshare.exe
          if-no-files-found: error

      - name: Sign the app
        if: steps.sign.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-app

      - name: Bundle the installer around the signed app
        if: steps.sign.outputs.enabled == 'true'
        shell: bash
        run: |
          cp signed-app/p2pshare.exe src-tauri/target/release/p2pshare.exe
          npx tauri bundle --bundles nsis

      - name: Upload the installer for signing
        if: steps.sign.outputs.enabled == 'true'
        id: unsigned-installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Sign the installer
        if: steps.sign.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer

      - name: Use the signed installer
        if: steps.sign.outputs.enabled == 'true'
        shell: bash
        run: cp signed-installer/*.exe src-tauri/target/release/bundle/nsis/

      # The macOS update is the app in a .tar.gz (kept by the "app" bundle
      # target). Packed on every build, so that a release tag meets no
      # surprise; only tags sign it (below).
      - name: Pack the macOS update
        if: runner.os == 'macOS'
        run: |
          b=src-tauri/target/release/bundle
          name=$(basename "$(ls $b/dmg/*.dmg)" .dmg)
          # No ._ files for extended attributes: they would land in the
          # installed app and break its signature.
          COPYFILE_DISABLE=1 tar -C $b/macos -czf "$b/macos/$name.app.tar.gz" P2PShare.app
          # What users get must pass the signature check, or macOS refuses
          # to open the updated app.
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "$b/macos/$name.app.tar.gz" -C "$RUNNER_TEMP/unpacked"
          codesign --verify --deep --strict "$RUNNER_TEMP/unpacked/P2PShare.app"
          ls -l "$b/macos/$name.app.tar.gz"

      # What the app's updater downloads, each with its .sig: the installer
      # (after SignPath, when signed), the AppImage, the app in a .tar.gz.
      - name: Sign the update
        if: env.UPDATER_KEY != ''
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          b=src-tauri/target/release/bundle
          case "$RUNNER_OS" in
            Windows) files=$(ls $b/nsis/*-setup.exe) ;;
            Linux) files=$(ls $b/appimage/*.AppImage) ;;
            macOS) files=$(ls $b/macos/*.app.tar.gz) ;;
          esac
          # Bound to the version: the app refuses a signature of another one
          # (requireSignedVersion), so an older release cannot pass for a new one.
          for f in $files; do npx tauri signer sign --app-version "${GITHUB_REF_NAME#v}" "$f" > /dev/null; ls -l "$f.sig"; done

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: P2PShare-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sig
          if-no-files-found: error

  android:
    needs: version
    if: github.event_name != 'workflow_dispatch' || inputs.android
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.3.13750724
      # Only given to version tags: a release APK keeps one key for life, or
      # Android refuses its updates (see "Android" in the README).
      KEYSTORE_BASE64: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
    steps:
      - name: Check out git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: android

      - name: Set up Java and the Android NDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$manager" --licenses > /dev/null
          "$manager" "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Set up the release key
        if: env.KEYSTORE_BASE64 != ''
        working-directory: src-tauri/gen/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build the APK
        run: |
          chmod +x src-tauri/gen/android/gradlew
          npx tauri android build --apk --target aarch64
          version=$(node -p "require('./package.json').version")
          mkdir -p apk
          mv src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "apk/P2PShare_${version}_android-arm64.apk"

      # Signed with the debug key of this run without the release key: to
      # try it from the Actions tab, not for a release (see publish).
      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.KEYSTORE_BASE64 != '' && 'P2PShare-android' || 'Test-android' }}
          path: apk/*.apk
          if-no-files-found: error

  publish:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ./artifacts
          # Not the unsigned files sent for signing, nor a test APK.
          pattern: P2PShare-*
          merge-multiple: true

      - name: Check out the changelog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: repo
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      # This version's section of CHANGELOG.md: on the release page, and in
      # latest.json for the app to show before installing it.
      - name: Write the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          version = os.environ['TAG'][1:]
          lines, inside = [], False
          for line in open('repo/CHANGELOG.md', encoding='utf-8'):
              if line.startswith('## '):
                  if inside:
                      break
                  inside = line[3:].split()[0] == version
              elif inside:
                  lines.append(line.rstrip())
          open('notes.md', 'w', encoding='utf-8').write('\n'.join(lines).strip() + '\n')
          PY
          {
            if grep -q . notes.md; then
              echo '## Nouveautés'
              echo
              cat notes.md
              echo
            fi
            cat <<'EOF'
          ## Installation

          Téléchargez l'installeur correspondant à votre système :

          - **Windows** : `P2PShare_*_x64-setup.exe`
          - **macOS** (Apple Silicon) : `P2PShare_*_aarch64.dmg`
          - **Linux** : `P2PShare_*_amd64.AppImage`
          - **Android** (arm64) : `P2PShare_*_android-arm64.apk`, si présent

          Depuis la version 3.4.5, l'app se met à jour toute seule sur Windows, macOS et Linux (Paramètres → À propos). Depuis une version plus ancienne, installez celle-ci une fois à la main.

          La version 3 n'échange pas avec les versions 2.x (Electron) : vos amis doivent aussi passer à la v3. Votre ID, vos amis et vos messages sont repris automatiquement.
          EOF
          } > release-body.md
          cat release-body.md

      # Lets users check what they downloaded (only Windows can be signed).
      - name: Compute checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.app.tar.gz' -o -name '*.apk' \) -print0 |
            while IFS= read -r -d '' f; do
              echo "$(sha256sum "$f" | cut -d' ' -f1)  $(basename "$f")"
            done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # A stable release must carry the APK: without the release key, stop
      # before anything is published or sent to winget.
      - name: Check the APK
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          if [ -z "$(find artifacts -name '*.apk')" ]; then
            echo "::error::No APK in this release: the ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi

      # What the app's updater reads (see update.rs): a stable release must
      # carry it, or apps would stay on the previous version.
      - name: Write latest.json
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import glob, json, os, sys, datetime
          tag, repo = os.environ['TAG'], os.environ['REPO']
          platforms = {}
          for target, pattern in [('windows-x86_64', '*-setup.exe'),
                                  ('darwin-aarch64', '*.app.tar.gz'),
                                  ('linux-x86_64', '*.AppImage')]:
              found = glob.glob(f'artifacts/**/{pattern}', recursive=True)
              if len(found) != 1 or not os.path.exists(found[0] + '.sig'):
                  print(f'::error::No signed update for {target}: the TAURI_SIGNING_PRIVATE_KEY secret is not set?')
                  sys.exit(1)
              name = os.path.basename(found[0])
              platforms[target] = {
                  'signature': open(found[0] + '.sig').read().strip(),
                  'url': f'https://github.com/{repo}/releases/download/{tag}/{name}',
              }
          latest = {
              'version': tag[1:],
              'notes': open('notes.md', encoding='utf-8').read().strip(),
              'pub_date': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'platforms': platforms,
          }
          json.dump(latest, open('artifacts/latest.json', 'w'), indent=2)
          print(json.dumps(latest, indent=2))
          PY

      # The APK comes only with the release key set up.
      - name: List the release files
        id: files
        run: |
          {
            echo 'list<<EOF'
            echo 'artifacts/**/*.exe'
            echo 'artifacts/**/*.dmg'
            echo 'artifacts/**/*.AppImage'
            if [ -n "$(find artifacts -name '*.apk')" ]; then echo 'artifacts/**/*.apk'; fi
            # latest.json comes after the release is complete (below).
            if [ -f artifacts/latest.json ]; then
              echo 'artifacts/**/*.app.tar.gz'
              echo 'artifacts/**/*.sig'
            fi
            echo 'artifacts/SHA256SUMS.txt'
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: P2PShare ${{ github.ref_name }}
          # Each installer sits in its bundle folder (nsis/, dmg/, appimage/).
          files: ${{ steps.files.outputs.list }}
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          generate_release_notes: true
          body_path: release-body.md

      # Last, once every file is up: apps that read it find the installers.
      - name: Publish latest.json
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" artifacts/latest.json --repo "$GITHUB_REPOSITORY"

  # Sends the new version to winget (see winget.yml); not a prerelease.
  winget:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    uses: ./.github/workflows/winget.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
